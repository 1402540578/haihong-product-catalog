name: 构建并发布产品目录

on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - "import/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 读取仓库文件
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: 安装构建依赖
        run: python -m pip install -r scripts/requirements.txt

      - name: 生成静态产品目录
        run: python scripts/build_catalog.py

      - name: 写入构建摘要
        if: always()
        shell: bash
        run: |
          if [ -f reports/build-summary.json ]; then
            echo '## 海宏产品目录构建结果' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat reports/build-summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 上传导入报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: import-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 30

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传网页文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
